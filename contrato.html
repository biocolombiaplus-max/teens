<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contrato de creadora — Orquídea Privé</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0709">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
.page{max-width:820px;margin:0 auto;padding:28px 16px 80px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;gap:12px}
.doc{background:#fbf8f4;color:#231a1d;border-radius:18px;padding:44px 40px;box-shadow:0 40px 90px -40px #000;font-size:15px;line-height:1.7}
@media(max-width:600px){.doc{padding:28px 20px;font-size:14px}.doc p{text-align:left}}
.doc .k-kicker{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#9a7a45;font-weight:700;margin-bottom:10px}
.doc h1{font-size:clamp(24px,4vw,32px);color:#1a1008;margin-bottom:24px}
.doc h2{font-family:var(--sans);font-size:15px;font-weight:700;margin:26px 0 8px;color:#1a1008;text-transform:uppercase;letter-spacing:.04em}
.doc p{margin-bottom:10px;text-align:justify}
.doc b.blank{background:#f3dcaa;padding:0 4px;border-radius:3px}
.doc .consent{display:grid;gap:8px;margin:12px 0 18px}
.doc .c-row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid #e3d8cc;border-radius:10px;background:#fff}
.doc label.c-row{cursor:pointer}
.doc .c-row input{width:20px;height:20px;flex:none;accent-color:#9a7a45;margin-top:2px}
.doc .c-row .mark{flex:none;font-size:11px;font-weight:800;letter-spacing:.06em;padding:3px 8px;border-radius:6px;background:#efe6da;color:#6b5a48}
.doc .k-date{margin-top:20px;font-style:italic}
.sigblock{margin-top:28px;padding-top:22px;border-top:1px solid #e3d8cc;display:grid;gap:4px}
.sigblock img{height:110px;width:auto;max-width:100%;object-fit:contain;object-position:left;border-bottom:1px solid #231a1d;margin-bottom:6px}
.sigblock small{color:#6b5a48;font-size:12px}
.sign-box{margin-top:24px}
.pad-wrap{position:relative;border-radius:14px;background:#fbf8f4;border:2px dashed #d9b77988;touch-action:none}
#pad{display:block;width:100%;height:220px;border-radius:14px;cursor:crosshair;touch-action:none}
.pad-hint{position:absolute;inset:0;display:grid;place-items:center;color:#9a8a7a;pointer-events:none;font-size:15px}
.pad-line{position:absolute;left:24px;right:24px;bottom:46px;border-bottom:1px solid #c9b9a5;pointer-events:none}
.pad-tools{display:flex;justify-content:space-between;align-items:center;margin:8px 0 16px}
.state{text-align:center;padding:60px 20px;display:grid;gap:14px;justify-items:center}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:24px 0}
@media print{
  body{background:#fff}
  .bg-glow,.top,.sign-box,.actions,.no-print{display:none!important}
  .page{padding:0;max-width:none}
  .doc{box-shadow:none;border-radius:0;padding:0}
}
</style>
</head>
<body>
<div class="bg-glow"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3dcaa"/><stop offset="1" stop-color="#b38d4f"/></linearGradient></defs>
  <symbol id="logo" viewBox="0 0 40 40"><path fill="none" stroke="url(#lg)" stroke-width="1.6" d="M20 4c3.5 5 3.5 11 0 16-3.5-5-3.5-11 0-16zM20 20c5-3.5 11-3.5 16 0-5 3.5-11 3.5-16 0zM20 20c-5-3.5-11-3.5-16 0 5 3.5 11 3.5 16 0zM20 20c3.5 5 3.5 11 0 16-3.5-5-3.5-11 0-16z"/><circle cx="20" cy="20" r="2.4" fill="url(#lg)"/></symbol>
</svg>

<div class="page">
  <div class="top">
    <a class="logo" href="index.html"><svg><use href="#logo"/></svg><div>Orquídea<small>PRIVÉ</small></div></a>
    <span class="dim">Documento privado</span>
  </div>
  <div id="app"><div class="state"><span class="spinner" style="color:var(--gold)"></span><p class="muted">Cargando tu contrato…</p></div></div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/core.js"></script>
<script src="assets/contrato.js"></script>
<script>
const { db, esc, fmtDate } = OP;
const app = document.getElementById('app');
const token = new URLSearchParams(location.search).get('t');

function stateMsg(title, text){
  app.innerHTML = `<div class="card-box state"><h2>${title}</h2><p class="muted">${text}</p></div>`;
}

function showSigned(html, when){
  app.innerHTML = `
    <div class="alert ok no-print" style="margin-bottom:18px">Contrato firmado el ${esc(fmtDate(when, true))}. Guarda una copia para ti.</div>
    <article class="doc">${html}</article>
    <div class="actions"><button class="btn btn-gold" onclick="print()">Descargar / imprimir copia (PDF)</button></div>`;
}

async function init(){
  if(!db) return stateMsg('Plataforma en configuración', 'La firma de contratos se activa cuando el sitio esté conectado a la base de datos.');
  if(!token) return stateMsg('Enlace incompleto', 'Abre el enlace exactamente como te llegó por WhatsApp.');
  const { data, error } = await db.rpc('get_contract', { p_token: token });
  if(error || !data) return stateMsg('Enlace no válido', 'Este contrato no existe o fue anulado. Pide un enlace nuevo al equipo.');
  if(data.status === 'firmado') return showSigned(data.signed_html, data.signed_at);
  if(data.expired) return stateMsg('El enlace venció', 'Por seguridad los enlaces duran 15 días. Pide uno nuevo por WhatsApp.');
  renderPending(data.model);
}

function renderPending(model){
  app.innerHTML = `
    <div class="alert info" style="margin-bottom:18px">Lee el contrato con calma. En el Anexo 1 marca solo el tipo de contenido que <b>tú quieras</b> hacer: nada de lo que no marques se te pedirá.</div>
    <article class="doc" id="doc">${OP_CONTRACT.render(model, { chat:true }, { editable:true })}</article>
    <div class="card-box sign-box">
      <span class="eyebrow">Firma</span>
      <h2 style="margin:10px 0 18px">Firma con tu dedo</h2>
      <div class="row two">
        <div class="field"><label for="sname">Nombre completo</label><input id="sname" value="${esc(model.full_name)}" autocomplete="name"></div>
        <div class="field"><label for="sdoc">Número de documento</label><input id="sdoc" inputmode="numeric" placeholder="Escríbelo para confirmar"></div>
      </div>
      <div class="pad-wrap"><canvas id="pad"></canvas><div class="pad-line"></div><div class="pad-hint" id="padHint">Firma aquí ✍️</div></div>
      <div class="pad-tools"><span class="dim">Usa tu dedo o el mouse</span><button class="btn btn-ghost btn-xs" id="clear" type="button">Borrar firma</button></div>
      <label class="check"><input type="checkbox" id="accept"><span>Declaro que soy mayor de 18 años, que leí y entendí todo el contrato, que lo firmo libremente y que las autorizaciones del Anexo 1 reflejan mi voluntad.</span></label>
      <div class="alert err" id="err" style="display:none;margin:8px 0 14px"></div>
      <button class="btn btn-gold btn-block" id="signBtn" style="margin-top:8px">Firmar contrato</button>
    </div>`;
  setupPad();
  document.getElementById('signBtn').addEventListener('click', () => sign(model));
}

let pad, ctx, inked = 0;
function setupPad(){
  pad = document.getElementById('pad'); ctx = pad.getContext('2d');
  const fit = () => {
    const r = pad.getBoundingClientRect(), dpr = Math.max(1, devicePixelRatio || 1);
    const old = inked ? pad.toDataURL() : null;
    pad.width = r.width * dpr; pad.height = r.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#14100c';
    if(old){ const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, r.width, r.height); im.src = old; }
  };
  fit(); addEventListener('resize', fit);
  let drawing = false, last = null;
  const pos = e => { const r = pad.getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; };
  pad.addEventListener('pointerdown', e => { drawing = true; last = pos(e); pad.setPointerCapture(e.pointerId); document.getElementById('padHint').style.display = 'none'; e.preventDefault(); });
  pad.addEventListener('pointermove', e => {
    if(!drawing) return;
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    inked += Math.hypot(p.x - last.x, p.y - last.y); last = p; e.preventDefault();
  });
  ['pointerup','pointercancel','pointerleave'].forEach(t => pad.addEventListener(t, () => drawing = false));
  document.getElementById('clear').addEventListener('click', () => {
    ctx.clearRect(0, 0, pad.width, pad.height); inked = 0; document.getElementById('padHint').style.display = '';
  });
}

// Firma recortada a su contenido, en PNG
function signaturePNG(){
  const w = pad.width, h = pad.height, d = ctx.getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = 0, y1 = 0;
  for(let y = 0; y < h; y++) for(let x = 0; x < w; x++) if(d[(y * w + x) * 4 + 3] > 0){
    if(x < x0) x0 = x; if(x > x1) x1 = x; if(y < y0) y0 = y; if(y > y1) y1 = y;
  }
  const m = 10, cw = Math.min(w, x1 - x0 + m * 2), ch = Math.min(h, y1 - y0 + m * 2);
  const out = document.createElement('canvas'); out.width = cw; out.height = ch;
  out.getContext('2d').drawImage(pad, Math.max(0, x0 - m), Math.max(0, y0 - m), cw, ch, 0, 0, cw, ch);
  return out.toDataURL('image/png');
}

async function sign(model){
  const err = document.getElementById('err'), btn = document.getElementById('signBtn');
  const fail = m => { err.textContent = m; err.style.display = 'block'; };
  err.style.display = 'none';
  const name = document.getElementById('sname').value.trim(), doc = document.getElementById('sdoc').value.trim();
  if(name.split(/\s+/).length < 2) return fail('Escribe tu nombre completo.');
  if(!doc) return fail('Escribe tu número de documento.');
  if(inked < 80) return fail('Dibuja tu firma en el recuadro.');
  if(!document.getElementById('accept').checked) return fail('Debes marcar la declaración final para firmar.');

  const consent = {};
  document.querySelectorAll('[data-consent]').forEach(i => consent[i.dataset.consent] = i.checked);
  const png = signaturePNG(), now = new Date();
  const html = OP_CONTRACT.render(model, consent, { date: now }) + `
    <div class="sigblock">
      <img src="${png}" alt="Firma">
      <b>${esc(name)}</b>
      <small>${esc(model.doc_type || 'CC')} No. ${esc(doc)} · LA CREADORA</small>
      <small>Firma electrónica · ${esc(now.toLocaleString('es-CO'))} · Contrato versión ${OP_CONTRACT.VERSION}</small>
      <small>Dispositivo: ${esc(navigator.userAgent.slice(0, 160))}</small>
    </div>`;

  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Firmando…';
  const { data, error } = await db.rpc('sign_contract', {
    p_token: token, p_name: name, p_doc: doc, p_signature: png, p_html: html, p_consent: consent, p_ua: navigator.userAgent
  });
  btn.disabled = false; btn.textContent = 'Firmar contrato';
  if(error) return fail(error.message);
  showSigned(html, data);
  scrollTo({ top:0, behavior:'smooth' });
}

init();
</script>
</body>
</html>
